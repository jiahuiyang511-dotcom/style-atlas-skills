name: Package style skills

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          gh repo clone "$GITHUB_REPOSITORY" source -- --depth 1 --branch "$RELEASE_TAG"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Build and verify six Skill packages
        run: python3 source/scripts/package_skills.py --output "$RUNNER_TEMP/skill-release"

      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/skill-release/"* \
            --repo "$GITHUB_REPOSITORY" --clobber
