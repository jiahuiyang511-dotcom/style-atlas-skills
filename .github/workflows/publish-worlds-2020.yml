name: Publish Worlds 2020 style
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-worlds-2020.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-worlds-2020-v1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASE_TAG: worlds-2020-v1.0.0
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Fetch exact approved source
        run: |
          set -euo pipefail
          gh repo clone "$REPO" source -- --depth 1
          git -C source fetch origin "$SOURCE_SHA" --depth 1
          git -C source checkout --detach "$SOURCE_SHA"
      - name: Package with the existing catalogue packager
        run: |
          set -euo pipefail
          python3 source/scripts/verify_catalogue.py
          python3 source/scripts/package_skills.py --output "$RUNNER_TEMP/all-style-packages"
          mkdir "$RUNNER_TEMP/worlds-2020-release"
          cp "$RUNNER_TEMP/all-style-packages/worlds-2020-visual-style.zip" "$RUNNER_TEMP/worlds-2020-release/"
          cd "$RUNNER_TEMP/worlds-2020-release"
          sha256sum worlds-2020-visual-style.zip > SHA256SUMS.txt
      - name: Publish without replacing historical assets
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Existing release retained; no overwrite performed."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$REPO" --target "$SOURCE_SHA" --title "Worlds 2020 — Brush, Ornamental Underpatterns & Image Through Type" --notes "Independent research-derived design Skill covering brush/type contrast, traditional ornamental underpatterns, and continuous imagery inside giant letterforms. Includes self-contained prompts, material adaptation, Chinese/Latin typography, source links and rights notices. Transfer rules explicitly separate original subject matter and centered emblems from reusable design relationships. Source artwork, full local research and generated cases are excluded from the download." "$RUNNER_TEMP/worlds-2020-release/worlds-2020-visual-style.zip" "$RUNNER_TEMP/worlds-2020-release/SHA256SUMS.txt"
